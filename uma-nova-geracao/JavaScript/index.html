<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050806">
<title>TALKINFU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lora:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="fio"></div>

<div id="cena">
  <!-- Cenário desenhado por cenario.js -->
  <svg id="plano" viewBox="0 0 1919 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>

  <div id="furao" data-e="feliz" role="button" aria-label="Fazer carinho no furão">
    <svg viewBox="0 0 220 290">
      <ellipse cx="112" cy="278" rx="72" ry="8" fill="rgba(0,0,0,.4)"/>
      <!-- cauda -->
      <path d="M140 262C196 272 214 226 200 190C194 174 180 176 182 190" fill="none" stroke="#0b100c" stroke-width="30" stroke-linecap="round"/>
      <path d="M140 262C196 272 214 226 200 190C194 174 180 176 182 190" fill="none" stroke="#e8d6ad" stroke-width="20" stroke-linecap="round"/>
      <path d="M200 190C194 174 180 176 182 190" fill="none" stroke="#5a3c27" stroke-width="20" stroke-linecap="round"/>
      <!-- corpo -->
      <path d="M112 128C158 128 170 190 160 238C156 262 136 268 112 268C88 268 68 262 64 238C54 190 66 128 112 128Z" fill="#e8d6ad" stroke="#0b100c" stroke-width="5" stroke-linejoin="round"/>
      <path d="M112 160C136 160 142 200 136 236C132 252 122 256 112 256C102 256 92 252 88 236C82 200 88 160 112 160Z" fill="#f6ecd2"/>
      <path d="M150 150C168 196 160 240 140 262C162 250 172 210 150 150Z" fill="#000" opacity=".16"/>
      <ellipse cx="84" cy="268" rx="24" ry="12" fill="#5a3c27" stroke="#0b100c" stroke-width="5"/>
      <ellipse cx="140" cy="268" rx="24" ry="12" fill="#5a3c27" stroke="#0b100c" stroke-width="5"/>
      <g fill="#e8d6ad" stroke="#0b100c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M82 158C62 178 66 204 84 214C92 204 90 180 98 166Z"/>
        <path d="M142 158C162 178 158 204 140 214C132 204 134 180 126 166Z"/>
        <ellipse cx="88" cy="214" rx="11" ry="9" fill="#5a3c27"/><ellipse cx="136" cy="214" rx="11" ry="9" fill="#5a3c27"/>
      </g>
      <ellipse cx="112" cy="142" rx="40" ry="10" fill="#000" opacity=".15"/>
      <!-- cabeça -->
      <g stroke="#0b100c" stroke-width="5"><circle cx="66" cy="76" r="15" fill="#e8d6ad"/><circle cx="158" cy="76" r="15" fill="#e8d6ad"/></g>
      <circle cx="66" cy="78" r="7" fill="#c98f86"/><circle cx="158" cy="78" r="7" fill="#c98f86"/>
      <ellipse cx="112" cy="102" rx="54" ry="44" fill="#e8d6ad" stroke="#0b100c" stroke-width="5"/>
      <path d="M92 66C100 58 124 58 132 66C128 76 96 76 92 66Z" fill="#5a3c27"/>
      <path d="M64 100C70 84 92 82 112 94C132 82 154 84 160 100C156 116 136 118 124 110C118 106 106 106 100 110C88 118 68 116 64 100Z" fill="#5a3c27"/>
      <ellipse cx="112" cy="124" rx="24" ry="16" fill="#f6ecd2"/>
      <g class="olhos">
        <ellipse cx="90" cy="100" rx="9" ry="11" fill="#0b100c"/><ellipse cx="134" cy="100" rx="9" ry="11" fill="#0b100c"/>
        <circle cx="93" cy="96" r="2.8" fill="#fff"/><circle cx="137" cy="96" r="2.8" fill="#fff"/>
      </g>
      <path d="M105 114Q112 110 119 114Q116 121 112 122Q108 121 105 114Z" fill="#c9877f" stroke="#0b100c" stroke-width="3" stroke-linejoin="round"/>
      <path class="b-feliz" d="M100 128Q106 136 112 128Q118 136 124 128" fill="none" stroke="#0b100c" stroke-width="3.5" stroke-linecap="round"/>
      <path class="b-triste" d="M101 134Q106 127 112 131Q118 127 123 134" fill="none" stroke="#0b100c" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse class="b-aberta" cx="112" cy="131" rx="8" ry="7" fill="#3a1414" stroke="#0b100c" stroke-width="3"/>
      <g class="zzz" fill="#e8e6d4" font-family="Lora,Georgia,serif" font-style="italic"><text x="160" y="50" font-size="24">z</text><text x="178" y="30" font-size="17">z</text></g>
    </svg>
  </div>
  <div id="prop"></div>
  <div id="fala"></div>
</div>

<header id="hud">
  <span id="hNome">Furão</span>
  <span id="hIdade">0 / 50 anos</span>
  <div class="barra" data-k="fome"><span>Fome</span><div class="trilho"><b></b></div></div>
  <div class="barra" data-k="felicidade"><span>Felicidade</span><div class="trilho"><b></b></div></div>
  <div class="barra" data-k="cansaco"><span>Cansaço</span><div class="trilho"><b></b></div></div>
</header>

<nav id="acoes">
  <button class="acao" data-a="alimentar"><i><svg viewBox="0 0 24 24"><path d="M3 12h18c0 5-4 8-9 8s-9-3-9-8z"/><circle cx="8" cy="8.5" r="1.3"/><circle cx="12" cy="7" r="1.3"/><circle cx="16" cy="8.5" r="1.3"/></svg></i>Alimentar</button>
  <button class="acao" data-a="brincar"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M5 9c5 1 9 5 10 10M4.5 14c3 .5 6 2.5 7.5 6M9 4.5c4 1 7.5 4 9 8M19 17c2 1 2.5 3 1 4"/></svg></i>Brincar</button>
  <button class="acao" data-a="descansar"><i><svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg></i>Descansar</button>
  <button class="acao" data-a="status"><i><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></i>Status</button>
</nav>

<section class="tela" id="inicio">
  <div class="caixa">
    <h1>Furão no Banco</h1>
    <div class="orn"></div>
    <p>Cuide dele até os 50 anos. Dê um nome ao seu furão.</p>
    <input id="inNome" maxlength="14" placeholder="Nome" autocomplete="off">
    <button class="botao" id="comecar">Começar</button>
    <button class="botao" id="continuar" hidden>Continuar jogo salvo</button>
  </div>
</section>

<section class="tela" id="status" hidden>
  <div class="caixa">
    <h2 id="sNome"></h2>
    <p id="sIdade" style="margin-top:6px"></p>
    <div class="orn"></div>
    <dl>
      <div><dt>Fome</dt><dd id="sFome"></dd></div>
      <div><dt>Felicidade</dt><dd id="sFelicidade"></dd></div>
      <div><dt>Cansaço</dt><dd id="sCansaco"></dd></div>
    </dl>
    <div class="orn"></div>
    <p id="sTexto"></p>
    <button class="botao" id="fechar">Fechar</button>
  </div>
</section>

<section class="tela" id="fim" hidden>
  <div class="caixa">
    <h2 id="fimTitulo"></h2>
    <div class="orn"></div>
    <p id="fimTexto"></p>
    <button class="botao" id="denovo">Jogar de novo</button>
  </div>
</section>

<script src="cenario.js"></script>
<script src="script.js"></script>
</body>
</html>
